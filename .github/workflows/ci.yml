name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  public-safe:
    name: Public-safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --history needs every commit, not a shallow clone
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Scan every tracked file
        run: ruby bin/check-public-safe --all
      - name: Scan every commit
        run: ruby bin/check-public-safe --history

  javascript:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      # The build also fails if the public renderer bundle imports the editor.
      - run: yarn build
